[build-system]
requires = [
    "setuptools>=61; python_version < '3.9'",
    "setuptools>=77; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[project]
name = "implib-so"
version = "0.1.0"
description = "Generate static import libraries for POSIX shared libraries"
readme = "README.md"
requires-python = ">=3.7"
dynamic = ["license"]
authors = [{ name = "Yury Gribov" }]
keywords = ["dlopen", "shared-libraries", "import-libraries", "elf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/yugr/Implib.so"
Documentation = "https://github.com/yugr/Implib.so#usage"
Source = "https://github.com/yugr/Implib.so"
Issues = "https://github.com/yugr/Implib.so/issues"

[project.scripts]
implib-gen = "implib_so:main"
"implib-gen.py" = "implib_so:main"

[tool.setuptools]
packages = ["implib_so"]
package-dir = { implib_so = "." }
include-package-data = false
